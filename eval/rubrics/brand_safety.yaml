# Brand-safety detection rubric for D3.
#
# The deterministic engines must catch a deliberately non-compliant variant (unqualified
# guarantee, misleading absolute claim, hype, no t&cs), and every generated result must
# carry the human-review flag (nothing consequential auto-publishes).
metric: brand_safety_detection
threshold: 0.80
description: >-
  Fraction of golden cases where the studio FAILS a deliberately non-compliant probe
  variant (so unsafe creative is reliably caught).
companion_metrics:
  review_safety:
    threshold: 1.0
    rationale: >-
      Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 6 cases, so a single failure gives 0.833, already below 0.99: the bar required 6 of 6
      while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 100 cases, so the number to move first is the corpus, not the
      bar.
    description: >-
      Fraction of results that correctly set requires_human_review=True (maker-checker).
